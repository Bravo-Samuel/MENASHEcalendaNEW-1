name: restore-guest-cta-files
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guest-open-calendar-cta-v3
      - name: Assemble App.tsx and Landing.tsx
        run: |
          set -euo pipefail
          cat _restore/part_*.b64 | tr -d '\n' | base64 -d > /tmp/restore.zip
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/restore.zip')
          open('artifacts/menashe-calendar/src/App.tsx','wb').write(z.read('App.tsx'))
          open('artifacts/menashe-calendar/src/pages/Landing.tsx','wb').write(z.read('Landing.tsx'))
          print('restored', z.namelist())
          PY
          rm -rf _restore
          git config user.name "Bravo-Samuel"
          git config user.email "ginkhochonohangsing@gmail.com"
          git add artifacts/menashe-calendar/src/App.tsx artifacts/menashe-calendar/src/pages/Landing.tsx
          git add -u _restore || true
          git commit -m "fix: Open Calendar guest CTA navigates to /app (surgical Landing + App)"
          git push origin HEAD:fix/guest-open-calendar-cta-v3
